<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neatkarīgs Web Šaušanas Simulators</title>
  <style>
    body { margin:0; background:#222; color:#eee; font-family:sans-serif; }
    #controls {
      background:#333; padding:1rem; display:flex; gap:1rem;
      flex-wrap:wrap; align-items:center; justify-content:center;
    }
    #shooters {
      display:grid; gap:4px; padding:4px;
      grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
      height: calc(100vh - 96px);
    }
    .shooter { position:relative; background:#000; overflow:hidden; }
    video, canvas { width:100%; height:100%; object-fit:cover; }
    .overlay { position:absolute; top:0; left:0; }
    .ui {
      position:absolute; top:4px; left:4px;
      background:rgba(0,0,0,0.6); padding:6px; border-radius:4px;
      font-size:0.9rem; text-align:left;
    }
    .ui select, .ui button { width:100%; margin-top:4px; }
    .timer { display:block; margin-top:6px; font-weight:bold; text-align:center; }
  </style>

  <!-- Definē onOpenCvReady pirms OpenCV.js ielādes -->
  <script>
    function onOpenCvReady() {
      cv['onRuntimeInitialized'] = () => {
        document.getElementById('btnStart').disabled = false;
        initSimulator();
      };
    }
  </script>
  <!-- Ielādē OpenCV.js no oficiālā CDN -->
  <script src="https://cdn.jsdelivr.net/npm/opencv@4.5.5/build/opencv.js"
          onload="onOpenCvReady()"></script>
</head>
<body>

  <div id="controls">
    <label>Šāvēju skaits:
      <select id="shooterCount">
        <option>1</option><option>2</option><option>3</option><option selected>4</option>
      </select>
    </label>
    <button id="btnStart" disabled>Start</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnClear" disabled>Clear</button>
  </div>

  <div id="shooters"></div>

  <script>
  async function initSimulator() {
    // Pieprasa kameru piekļuvi
    try {
      const grant = await navigator.mediaDevices.getUserMedia({ video: true });
      grant.getTracks().forEach(t => t.stop());
    } catch (e) {
      alert('Lūdzu atļauj kamerai piekļuvi, lai simulatoru lietotu.');
      return;
    }

    // Iegūst video ievades ierīces
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');

    const cntSel   = document.getElementById('shooterCount');
    const btnStart = document.getElementById('btnStart');
    const btnStop  = document.getElementById('btnStop');
    const btnClear = document.getElementById('btnClear');
    const container= document.getElementById('shooters');

    let streams = [], timers = [], sessions = [];

    function makeGrid(n) {
      container.innerHTML = '';
      sessions = Array(n).fill().map(() => []);
      streams  = Array(n).fill(null);
      timers   = Array(n).fill(null);

      for (let i = 0; i < n; i++) {
        const div = document.createElement('div');
        div.className = 'shooter';
        div.innerHTML = `
          <video autoplay playsinline muted></video>
          <canvas class="overlay"></canvas>
          <div class="ui">
            <label>Cam:</label>
            <select class="camSel"></select>
            <button class="rot">⟳</button>
            <button class="mir">⇋</button>
            <span class="timer">00:00</span>
          </div>`;
        container.appendChild(div);
      }

      container.querySelectorAll('.shooter').forEach((div, i) => {
        const sel = div.querySelector('.camSel');
        cams.forEach((c, idx) => {
          const opt = document.createElement('option');
          opt.value = c.deviceId;
          opt.textContent = `Cam${idx+1}`;
          sel.appendChild(opt);
        });
        sel.onchange = () => startStream(i, sel.value);
        div.querySelector('.rot').onclick = () => toggleRotate(i);
        div.querySelector('.mir').onclick = () => toggleMirror(i);
        startStream(i, cams[0].deviceId);
      });
    }

    async function startStream(i, deviceId) {
      const video = container.children[i].querySelector('video');
      if (streams[i]) streams[i].getTracks().forEach(t => t.stop());
      try {
        streams[i] = await navigator.mediaDevices.getUserMedia({ video: { deviceId } });
        video.srcObject = streams[i];
      } catch (e) {
        console.error('Kļūda piekļūstot kamerai:', e);
      }
    }

    function toggleRotate(i) {
      const v = container.children[i].querySelector('video');
      v.style.transform = v.style.transform.includes('rotate(90deg)')
        ? v.style.transform.replace('rotate(90deg)', '')
        : v.style.transform + ' rotate(90deg)';
    }

    function toggleMirror(i) {
      const v = container.children[i].querySelector('video');
      v.style.transform = v.style.transform.includes('scaleX(-1)')
        ? v.style.transform.replace('scaleX(-1)', '')
        : v.style.transform + ' scaleX(-1)';
    }

    function fmt(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function clearAll() {
      sessions.forEach((_, i) => {
        sessions[i] = [];
        const c = container.children[i].querySelector('canvas');
        c.getContext('2d').clearRect(0,0,c.width,c.height);
      });
    }

    function stopAll() {
      btnStart.disabled = false;
      btnStop.disabled  = true;
      timers.forEach(t => clearInterval(t));
    }

    function startAll() {
      btnStart.disabled = true;
      btnStop.disabled  = false;
      btnClear.disabled= false;
      clearAll();
      sessions = sessions.map(() => []);
      container.querySelectorAll('.shooter').forEach((div, i) => {
        let t = 0;
        const te = div.querySelector('.timer');
        te.textContent = fmt(t);
        timers[i] = setInterval(() => te.textContent = fmt(++t), 1000);
        processFrame(i);
      });
    }

    function processFrame(i) {
      if (btnStop.disabled) return;
      const div = container.children[i];
      const video = div.querySelector('video');
      const canvas = div.querySelector('canvas');
      if (video.readyState < 2) {
        return requestAnimationFrame(() => processFrame(i));
      }
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      const cap = new cv.VideoCapture(video);
      const src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
      cap.read(src);

      let hsv = new cv.Mat(), m1 = new cv.Mat(), m2 = new cv.Mat(), mask = new cv.Mat();
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
      const low1=[0,150,150,0], hi1=[10,255,255,255],
            low2=[160,150,150,0], hi2=[180,255,255,255];
      cv.inRange(hsv, new cv.Mat(hsv.rows,hsv.cols,hsv.type(),low1),
                     new cv.Mat(hsv.rows,hsv.cols,hsv.type(),hi1), m1);
      cv.inRange(hsv, new cv.Mat(hsv.rows,hsv.cols,hsv.type(),low2),
                     new cv.Mat(hsv.rows,hsv.cols,hsv.type(),hi2), m2);
      cv.add(m1, m2, mask);

      const ctrs = new cv.MatVector(), hier = new cv.Mat();
      cv.findContours(mask, ctrs, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for (let j = 0; j < ctrs.size(); j++) {
        const cnt = ctrs.get(j), mo = cv.moments(cnt);
        if (mo.m00 > 1000) {
          const cx = mo.m10/mo.m00, cy = mo.m01/mo.m00;
          sessions[i].push({ x:cx, y:cy });
          ctx.strokeStyle='lime'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.arc(cx,cy,15,0,2*Math.PI); ctx.stroke();
          ctx.fillStyle='lime'; ctx.font='20px sans-serif';
          ctx.fillText(sessions[i].length, cx+8, cy-8);
        }
        cnt.delete();
      }

      src.delete(); hsv.delete(); m1.delete(); m2.delete(); mask.delete();
      ctrs.delete(); hier.delete();
      requestAnimationFrame(() => processFrame(i));
    }

    // Piesaista pogas un inicializē
    cntSel.onchange = () => { makeGrid(+cntSel.value); clearAll(); };
    btnStart.onclick = startAll;
    btnStop.onclick  = stopAll;
    btnClear.onclick= clearAll;

    makeGrid(+cntSel.value);
  }
  </script>
</body>
</html>
